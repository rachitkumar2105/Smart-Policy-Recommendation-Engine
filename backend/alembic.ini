[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./spre.db
; note: migrations run over the sync pysqlite driver even though the app
; connects with aiosqlite at runtime -- alembic's autogenerate/offline
; tooling does not need the async driver.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
